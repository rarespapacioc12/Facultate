let cur=0, score=0, answered=false, selected=[];
const total=QUESTIONS.length;

function render(){
  const app=document.getElementById('app');
  if(cur>=total){renderFinal(app);return;}
  const q=QUESTIONS[cur];
  const pct=Math.round((cur/total)*100);
  const letters='ABCD';
  app.innerHTML=`
<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
<div class="score-row">
  <span>Întrebarea <span class="score-num">${cur+1}</span> din ${total}</span>
  <span style="margin-left:auto">Scor: <span class="score-num">${score}</span></span>
</div>
<span class="section-badge">${q.s}</span>
<div class="q-num">Întrebarea ${cur+1}</div>
<div class="q-text">${q.t}</div>
${q.multi?'<div class="multi-hint">Pot fi mai multe răspunsuri corecte.</div>':''}
${q.s.startsWith('Adevărat')?renderTF(q):renderOpts(q,letters)}
<div id="fb"></div>
<div class="nav">
  <button class="btn primary" id="check-btn" onclick="check()">${answered?'Următoarea →':'Verifică'}</button>
</div>`;
}

function renderOpts(q,letters){
  return`<div class="options">${q.o.map((o,i)=>`<div class="opt" id="opt${i}" onclick="toggle(${i})">${q.multi?`<span class="opt-letter"><input type="checkbox" id="cb${i}" style="margin:0"> ${letters[i]}</span>`:`<span class="opt-letter">${letters[i]}</span>`}<span>${o}</span></div>`).join('')}</div>`;
}
function renderTF(q){
  return`<div class="tf-opts"><button class="tf-btn" id="opt0" onclick="toggle(0)">Adevărat</button><button class="tf-btn" id="opt1" onclick="toggle(1)">Fals</button></div>`;
}

function toggle(i){
  if(answered)return;
  const q=QUESTIONS[cur];
  if(!q.multi){selected=[i];}
  else{if(selected.includes(i))selected=selected.filter(x=>x!==i);else selected.push(i);}
  q.o.forEach((_,j)=>{
    const el=document.getElementById('opt'+j);
    if(el){el.classList.toggle('selected',selected.includes(j));}
    const cb=document.getElementById('cb'+j);
    if(cb)cb.checked=selected.includes(j);
  });
}

function check(){
  if(answered){cur++;selected=[];answered=false;render();return;}
  if(selected.length===0)return;
  answered=true;
  const q=QUESTIONS[cur];
  const correct=q.a.slice().sort().join(',');
  const got=selected.slice().sort().join(',');
  const isRight=correct===got;
  if(isRight)score++;
  q.o.forEach((_,j)=>{
    const el=document.getElementById('opt'+j);
    if(!el)return;
    const isAns=q.a.includes(j);
    const isSel=selected.includes(j);
    if(isAns&&isSel)el.classList.add('correct');
    else if(!isAns&&isSel)el.classList.add('wrong');
    else if(isAns&&!isSel)el.classList.add('missed');
  });
  const fb=document.getElementById('fb');
  if(fb){
    const correctLabels=q.a.map(i=>q.o[i]).join(', ');
    fb.innerHTML=`<div class="feedback ${isRight?'ok':'nok'}">${isRight?'✓ Corect!':'✗ Greșit. Răspuns corect: <strong>'+correctLabels+'</strong>'}</div>`;
  }
  document.getElementById('check-btn').textContent='Următoarea →';
}

function renderFinal(app){
  const pct=Math.round((score/total)*100);
  let emoji=pct>=90?'🏆':pct>=70?'👍':pct>=50?'📚':'💪';
  app.innerHTML=`<div class="final-card">
<div style="font-size:36px;margin-bottom:0.5rem">${emoji}</div>
<div class="final-score">${score}/${total}</div>
<div class="final-label">${pct}% răspunsuri corecte</div>
<div class="stat-row">
  <div class="stat"><div class="stat-n" style="color:#0F6E56">${score}</div><div class="stat-l">corecte</div></div>
  <div class="stat"><div class="stat-n" style="color:#993C1D">${total-score}</div><div class="stat-l">greșite</div></div>
</div>
<button class="btn primary" onclick="restart()">Încearcă din nou ↺</button>
</div>`;
}

function restart(){cur=0;score=0;answered=false;selected=[];render();}
render();
</script>
